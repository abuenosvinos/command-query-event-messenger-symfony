# Worker high priority (urgent) — 3 parallel processes
[program:messenger_async_urgent]
command=php /var/www/html/bin/console messenger:consume async
    --queues=queue_async_urgent
    --time-limit=3600
    --memory-limit=256M
numprocs=3
startsecs=5
autostart=true
autorestart=true
startretries=10
process_name=%(program_name)s_%(process_num)02d
stdout_logfile=/var/log/supervisor/messenger_urgent_%(process_num)02d.log
stderr_logfile=/var/log/supervisor/messenger_urgent_%(process_num)02d.error.log


# Worker low priority — 1 process
[program:messenger_async_low]
command=php /var/www/html/bin/console messenger:consume async_low
    --time-limit=3600
    --memory-limit=128M
numprocs=1
startsecs=5
autostart=false
autorestart=true
startretries=10
process_name=%(program_name)s_%(process_num)02d
stdout_logfile=/var/log/supervisor/messenger_low_%(process_num)02d.log
stderr_logfile=/var/log/supervisor/messenger_low_%(process_num)02d.error.log


# Worker DLQ — 1 dedicated process, DOES NOT PROCESS AUTOMATICALLY
# This worker is stopped by default (autostart=false)
# It must be started MANUALLY for a supervised replay
[program:messenger_dead_letter]
command=php /var/www/html/bin/console messenger:consume dead_letter
    --time-limit=300
    --limit=100
    --memory-limit=128M
numprocs=1
startsecs=5
autostart=false   # ← DOES NOT START ALL BY ITSELF
autorestart=false
startretries=3
process_name=%(program_name)s_%(process_num)02d
stdout_logfile=/var/log/supervisor/messenger_dead_letter_%(process_num)02d.log
stderr_logfile=/var/log/supervisor/messenger_dead_letter_%(process_num)02d.error.log